<div id="root">
  <div>
    <a href="https://idverse.com" target="_blank">
      <img src="/logo.svg" class="logo" alt="IDVerse logo" />
    </a>
  </div>
  <h1>Simple Face Scan with Angluar</h1>
  <div class="card" *ngIf="loading">
    <img src="/loading.svg" alt="Loading icon" />
  </div>
  <div class="card" *ngIf="!loading">
    <button (click)="onhandleStart()">Start Face Scan</button>
  </div>
  <div class="card" *ngIf="resultData === 1">
    <button (click)="onClose()">Close</button>
  </div>
  <idv-modal *ngIf="errorText" warning visible heading="An error occurred.">
    <p>{{ errorText }}</p>
    <div>
      <idv-button (click)="onClearError()" label="Close" variant="primary outline"></idv-button>
    </div>
  </idv-modal>

  <!-- Initialize endpoint is called as soon as <idverse-sdk-ui/> is in the DOM -->
  <!-- // Use `enable-dfa` prop to choose whether or not DFA engine is enabled, if value is static and will not change // If for some reason value is dynamic (needs to change) use `sdk.setEnableDFA()` -->
  <!-- // Use `enable-face-match` prop to choose whether or not FaceMatch engine is enabled, if value is static and will not change // If for some reason value is dynamic (needs to change) use `sdk.setEnableFaceMatch()` enable-face-match={true}  -->
  <!-- worker-path="./sdk-idverse/assets/IDVerseSDK.worker.min.XXXXX.js"  -->
  <idverse-sdk-ui [attr.session-url]="sessionUrl" [attr.session-token]="sessionToken" [attr.session-build-id]="buildId"
    [attr.enable-dfa]="true" [attr.enable-face-match]="true" [attr.skip-face-scan-intro]="true"></idverse-sdk-ui>


  <p class="read-the-docs">Click on the IDVerse logo to learn more</p>
</div>

<router-outlet />
